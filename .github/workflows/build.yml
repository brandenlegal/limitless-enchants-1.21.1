name: Build 1.21.1


on:
  push:
    branches: [ main ]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Unzip project
        run: unzip -q limitless-enchants-1.21.1-project.zip -d project && mv project/* ./


      - name: Fix YACL version
        run: |
          for f in gradle.properties build.gradle; do
            [ -f "$f" ] && sed -i 's/3\.8\.0+1\.21\.1-fabric/3.6.2+1.21-fabric/g' "$f"
          done
          grep -rn "yacl_version\|yet_another_config_lib_v3" gradle.properties build.gradle 2>/dev/null || true


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build --no-daemon


      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: limitless-enchants-1.21.1
          path: build/libs/*.jar
