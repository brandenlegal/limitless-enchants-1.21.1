name: Build 1.21.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q limitless-enchants-1.21.1-project.zip -d project && mv project/* ./
      - name: Remove YACL dependency
        run: |
          sed -i '/yet_another_config_lib/d' project/build.gradle
          rm -f project/src/main/java/com/branden/limitlessenchants/client/ModConfigScreen.java
          echo "YACL removed"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: limitless-enchants-1.21.1
          path: build/libs/*.jar
